<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時計算マスター - 中学受験学習用</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
        
        .clock {
            width: 300px;
            height: 300px;
            border: 12px solid #334155;
            border-radius: 50%;
            position: relative;
            background: #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin: 0 auto;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: center bottom;
            border-radius: 10px;
            z-index: 10;
        }

        /* 短針：1分で0.5度動く */
        .hour-hand {
            width: 10px;
            height: 75px;
            background: #1e293b;
            margin-left: -5px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 長針：1分で6度動く */
        .minute-hand {
            width: 5px;
            height: 125px;
            background: #e11d48;
            margin-left: -2.5px;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .center-dot {
            width: 16px;
            height: 16px;
            background: #1e293b;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            border: 2px solid #fff;
        }

        .number {
            position: absolute;
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 40px;
            font-weight: 900;
            font-size: 1.6rem;
            color: #334155;
            z-index: 5;
        }

        .tick {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 8px;
            background: #cbd5e1;
            margin-left: -1px;
            transform-origin: center 138px;
        }
        .tick-major {
            width: 4px;
            height: 14px;
            background: #475569;
            margin-left: -2px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-[2.5rem] shadow-2xl flex flex-col items-center w-full max-w-sm border border-slate-100">
        <h2 class="text-xl font-bold text-slate-700 mb-6 flex items-center gap-2">
            <span class="text-2xl">🎓</span> 中学受験：時計算マスター
        </h2>
        
        <div class="clock" id="clock-face">
            <div id="hour-hand" class="hand hour-hand"></div>
            <div id="minute-hand" class="hand minute-hand"></div>
            <div class="center-dot"></div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-3 w-full">
            <div class="text-5xl font-black text-slate-800 bg-slate-100 px-8 py-3 rounded-2xl font-mono shadow-inner border border-slate-200" id="digital-display">
                10:00
            </div>
            <div class="text-sm font-bold text-rose-600 bg-rose-50 px-5 py-2 rounded-full border border-rose-100 shadow-sm" id="angle-display">
                長針と短針の角度: 0°
            </div>
        </div>

        <div class="mt-6 flex gap-2 w-full">
            <input type="text" id="time-input" inputmode="numeric" placeholder="例 10:30" class="flex-1 border-2 border-slate-200 rounded-xl px-4 py-3 text-center font-bold focus:border-blue-500 outline-none text-lg shadow-sm">
            <button onclick="setTimeFromInput()" class="bg-slate-800 text-white px-6 py-3 rounded-xl font-bold active:scale-95 transition-all shadow-md">セット</button>
        </div>

        <div class="mt-6 grid grid-cols-4 gap-2 w-full text-xs font-bold">
            <button onclick="addMinutes(-30)" class="bg-slate-100 py-3 rounded-xl active:bg-slate-200 text-slate-600">-30</button>
            <button onclick="addMinutes(-5)" class="bg-slate-100 py-3 rounded-xl active:bg-slate-200 text-slate-600">-5</button>
            <button onclick="addMinutes(5)" class="bg-blue-100 text-blue-700 py-3 rounded-xl active:bg-blue-200">+5</button>
            <button onclick="addMinutes(30)" class="bg-blue-100 text-blue-700 py-3 rounded-xl active:bg-blue-200">+30</button>
            
            <button onclick="addMinutes(-1)" class="col-span-2 bg-rose-50 text-rose-600 py-4 rounded-xl border border-rose-100 active:bg-rose-100">1分もどす</button>
            <button onclick="addMinutes(1)" class="col-span-2 bg-rose-500 text-white py-4 rounded-xl shadow-md active:bg-rose-600">1分すすめる</button>
        </div>
        
        <div class="mt-6 p-4 bg-amber-50 rounded-2xl w-full border border-amber-100">
            <p class="text-[10px] text-amber-800 font-bold leading-relaxed">
                💡 受験のコツ：<br>
                ・長針は1分で <span class="text-rose-600">6°</span> すすむ<br>
                ・短針は1分で <span class="text-rose-600">0.5°</span> すすむ<br>
                ・1分たつと、2つの針は <span class="text-rose-600">5.5°</span> ずつ近づく！
            </p>
        </div>
    </div>

    <script>
        let totalMinutes = 600;

        function updateClock() {
            if (totalMinutes < 0) totalMinutes += 1440;
            totalMinutes %= 1440;

            const h24 = Math.floor(totalMinutes / 60);
            const h12 = h24 % 12;
            const mins = totalMinutes % 60;

            const hDeg = (h12 * 30) + (mins * 0.5);
            const mDeg = mins * 6;
            
            document.getElementById('hour-hand').style.transform = `rotate(${hDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `rotate(${mDeg}deg)`;
            
            const displayH = h12 === 0 ? 12 : h12;
            const mStr = mins.toString().padStart(2, '0');
            document.getElementById('digital-display').innerText = `${displayH}:${mStr}`;

            let diff = Math.abs(hDeg - mDeg);
            if (diff > 180) diff = 360 - diff;
            // 受験算数では正確な数値が大事なので、小数第2位まで表示
            document.getElementById('angle-display').innerText = `長針と短針の角度: ${diff % 1 === 0 ? diff.toFixed(0) : diff.toFixed(1)}°`;
        }

        function addMinutes(m) {
            totalMinutes += m;
            updateClock();
        }

        function setTimeFromInput() {
            const input = document.getElementById('time-input');
            const val = input.value.trim();
            const match = val.match(/^(\d{1,2})[:：\s]?(\d{2})$/) || val.match(/^(\d{1,2})$/);
            
            if (match) {
                let h = parseInt(match[1]);
                let m = match[2] ? parseInt(match[2]) : 0;
                if (h >= 0 && h <= 24 && m >= 0 && m <= 59) {
                    totalMinutes = (h % 12) * 60 + m;
                    updateClock();
                    input.value = "";
                }
            }
        }

        function createFace() {
            const face = document.getElementById('clock-face');
            
            // 目盛り
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.className = i % 5 === 0 ? 'tick tick-major' : 'tick';
                tick.style.transform = `rotate(${i * 6}deg)`;
                face.appendChild(tick);
            }

            // 数字
            for (let i = 1; i <= 12; i++) {
                const num = document.createElement('div');
                num.className = 'number';
                num.innerText = i;
                const angle = (i * 30) * (Math.PI / 180);
                const x = 150 + 108 * Math.sin(angle) - 20;
                const y = 150 - 108 * Math.cos(angle) - 20;
                num.style.left = x + 'px';
                num.style.top = y + 'px';
                face.appendChild(num);
            }
        }

        window.onload = () => {
            createFace();
            updateClock();
        };
    </script>
</body>
</html>
