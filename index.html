<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>とけいマスター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        
        .clock {
            width: 300px;
            height: 300px;
            border: 12px solid #444;
            border-radius: 50%;
            position: relative;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin: 0 auto;
            /* z-indexの基準を作る */
            display: block; 
        }

        /* 針の共通設定 */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: center bottom;
            border-radius: 10px;
            /* 針を数字(z-index: 5)より上に配置 */
            z-index: 10;
        }

        .hour-hand {
            width: 10px;
            height: 70px;
            background: #333;
            margin-left: -5px;
            transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }

        .minute-hand {
            width: 6px;
            height: 120px;
            background: #ef4444;
            margin-left: -3px;
            transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }

        .center-dot {
            width: 16px;
            height: 16px;
            background: #222;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            border: 2px solid #fff;
        }

        /* 数字のスタイル：針より下に配置 */
        .number {
            position: absolute;
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 40px;
            font-weight: 900;
            font-size: 1.6rem;
            color: #333;
            z-index: 5;
        }

        /* 目盛りのスタイル */
        .tick {
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 8px;
            background: #bbb;
            margin-left: -1px;
            transform-origin: center 138px;
            z-index: 1;
        }
        .tick-major {
            width: 4px;
            height: 14px;
            background: #444;
            margin-left: -2px;
        }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-6 rounded-[2.5rem] shadow-2xl flex flex-col items-center w-full max-w-sm">
        <h2 class="text-xl font-bold text-blue-600 mb-6">✍️ とけいのもんだい</h2>
        
        <div class="clock" id="clock-face">
            <div id="hour-hand" class="hand hour-hand"></div>
            <div id="minute-hand" class="hand minute-hand"></div>
            <div class="center-dot"></div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-3">
            <div class="text-5xl font-black text-gray-800 bg-gray-100 px-8 py-3 rounded-2xl font-mono shadow-inner" id="digital-display">
                10:00
            </div>
            <div class="text-sm font-bold text-orange-600 bg-orange-50 px-5 py-2 rounded-full border border-orange-100" id="angle-display">
                長針と短針の角度: 0°
            </div>
        </div>

        <div class="mt-6 flex gap-2 w-full">
            <input type="text" id="time-input" placeholder="例 10:30" class="flex-1 border-2 border-blue-100 rounded-xl px-4 py-3 text-center font-bold focus:border-blue-500 outline-none text-lg">
            <button onclick="setTimeFromInput()" class="bg-blue-600 text-white px-6 py-3 rounded-xl font-bold active:scale-95 transition-all shadow-md">セット</button>
        </div>

        <div class="mt-6 grid grid-cols-4 gap-2 w-full text-sm font-bold">
            <button onclick="addMinutes(-30)" class="bg-gray-100 py-3 rounded-xl active:bg-gray-200">-30分</button>
            <button onclick="addMinutes(-5)" class="bg-gray-100 py-3 rounded-xl active:bg-gray-200">-5分</button>
            <button onclick="addMinutes(5)" class="bg-blue-100 text-blue-700 py-3 rounded-xl active:bg-blue-200">+5分</button>
            <button onclick="addMinutes(30)" class="bg-blue-100 text-blue-700 py-3 rounded-xl active:bg-blue-200">+30分</button>
            
            <button onclick="addMinutes(-1)" class="col-span-2 bg-orange-50 text-orange-600 py-4 rounded-xl active:bg-orange-100">1分もどす</button>
            <button onclick="addMinutes(1)" class="col-span-2 bg-orange-500 text-white py-4 rounded-xl shadow-md active:bg-orange-600">1分すすめる</button>
        </div>
    </div>

    <script>
        let totalMinutes = 600; // 10:00

        // 針を動かす関数
        function updateClock() {
            // 時間の範囲を0〜1439分に収める
            if (totalMinutes < 0) totalMinutes += 1440;
            totalMinutes %= 1440;

            const hours24 = Math.floor(totalMinutes / 60);
            const hours12 = hours24 % 12;
            const mins = totalMinutes % 60;

            // 角度の計算
            const hDeg = (hours12 * 30) + (mins * 0.5);
            const mDeg = mins * 6;
            
            // 針を回転
            const hHand = document.getElementById('hour-hand');
            const mHand = document.getElementById('minute-hand');
            if (hHand && mHand) {
                hHand.style.transform = `rotate(${hDeg}deg)`;
                mHand.style.transform = `rotate(${mDeg}deg)`;
            }
            
            // デジタル表示の更新
            const displayH = hours12 === 0 ? 12 : hours12;
            const mStr = mins.toString().padStart(2, '0');
            const digital = document.getElementById('digital-display');
            if (digital) digital.innerText = `${displayH}:${mStr}`;

            // 角度の更新
            let diff = Math.abs(hDeg - mDeg);
            if (diff > 180) diff = 360 - diff;
            const angleText = document.getElementById('angle-display');
            if (angleText) angleText.innerText = `長針と短針の角度: ${diff.toFixed(1)}°`;
        }

        // ボタン用関数
        function addMinutes(m) {
            totalMinutes += m;
            updateClock();
        }

        // 入力フォーム用関数
        function setTimeFromInput() {
            const input = document.getElementById('time-input');
            const val = input.value;
            // 10:30 や 10 30 や 1030 などの形式に対応
            const match = val.match(/^(\d{1,2})[:：\s]?(\d{2})$/) || val.match(/^(\d{1,2})$/);
            
            if (match) {
                let h = parseInt(match[1]);
