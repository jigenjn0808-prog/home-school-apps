<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>とけいのおべんきょう</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        
        .clock {
            width: 300px;
            height: 300px;
            border: 10px solid #444;
            border-radius: 50%;
            position: relative;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin: 0 auto;
        }

        /* 針の共通設定 */
        .hand {
            position: absolute;
            left: 50%;
            bottom: 50%;
            /* 左右中央(X)を自分の幅の半分戻し、回転軸を下端(Y)に固定 */
            transform-origin: 50% 100%; 
            border-radius: 10px;
            transition: transform 0.5s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }

        /* 短針（黒） */
        .hour-hand {
            width: 8px;
            height: 75px;
            background: #333;
            margin-left: -4px; /* 幅の半分マイナス */
            z-index: 5;
        }

        /* 長針（赤） */
        .minute-hand {
            width: 5px;
            height: 120px;
            background: #ef4444;
            margin-left: -2.5px; /* 幅の半分マイナス */
            z-index: 4;
        }

        .center-dot {
            width: 16px;
            height: 16px;
            background: #222;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            border: 2px solid #fff;
        }

        .number {
            position: absolute;
            width: 40px;
            height: 40px;
            text-align: center;
            line-height: 40px;
            font-weight: 800;
            font-size: 1.5rem;
            color: #333;
        }

        .tick {
            position: absolute;
            width: 2px;
            height: 10px;
            background: #ddd;
            left: 50%;
            margin-left: -1px;
            transform-origin: 50% 140px; /* 時計の半径に合わせる */
        }
    </style>
</head>
<body class="bg-yellow-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="bg-white p-8 rounded-[2.5rem] shadow-2xl flex flex-col items-center w-full max-w-sm">
        <h2 class="text-2xl font-bold text-orange-600 mb-8">⏰ とけいのおべんきょう</h2>
        
        <div class="clock" id="clock-face">
            <div id="ticks-container"></div>
            <div id="numbers-container"></div>
            <div id="hour-hand" class="hand hour-hand"></div>
            <div id="minute-hand" class="hand minute-hand"></div>
            <div class="center-dot"></div>
        </div>

        <div class="mt-10 text-center">
            <div class="text-5xl font-black text-gray-800 bg-gray-100 px-10 py-4 rounded-3xl inline-block font-mono shadow-inner" id="digital-display">
                10:00
            </div>
        </div>

        <div class="mt-10 grid grid-cols-2 gap-4 w-full">
            <button onclick="addMinutes(-30)" class="bg-orange-100 active:bg-orange-200 text-orange-700 font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-sm">30分もどす</button>
            <button onclick="addMinutes(30)" class="bg-orange-500 active:bg-orange-600 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-md">30分すすめる</button>
            <button onclick="addMinutes(-5)" class="bg-blue-100 active:bg-blue-200 text-blue-700 font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-sm">5分もどす</button>
            <button onclick="addMinutes(5)" class="bg-blue-500 active:bg-blue-600 text-white font-bold py-4 rounded-2xl transition-all active:scale-95 shadow-md">5分すすめる</button>
        </div>
    </div>

    <script>
        let totalMinutes = 600; // 10:00

        function updateClock() {
            if (totalMinutes < 0) totalMinutes += 1440;
            totalMinutes %= 1440;

            const hours24 = Math.floor(totalMinutes / 60);
            const hours12 = hours24 % 12;
            const mins = totalMinutes % 60;

            // 角度の計算
            const hDeg = (hours12 * 30) + (mins * 0.5);
            const mDeg = mins * 6;
            
            document.getElementById('hour-hand').style.transform = `rotate(${hDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `rotate(${mDeg}deg)`;
            
            // デジタル表示
            const displayH = hours12 === 0 ? 12 : hours12;
            const mStr = mins.toString().padStart(2, '0');
            document.getElementById('digital-display').innerText = `${displayH}:${mStr}`;
        }

        function addMinutes(m) {
            totalMinutes += m;
            updateClock();
        }

        function createFace() {
            const numContainer = document.getElementById('numbers-container');
            const tickContainer = document.getElementById('ticks-container');
            
            // 数字の配置（中心から115pxの位置に配置）
            for (let i = 1; i <= 12; i++) {
                const num = document.createElement('div');
                num.className = 'number';
                num.innerText = i;
                const angle = (i * 30) * (Math.PI / 180);
                const x = 150 + 115 * Math.sin(angle) - 20; // 150は時計の半分、20は数字の幅の半分
                const y = 150 - 115 * Math.cos(angle) - 20;
                num.style.left = x + 'px';
                num.style.top = y + 'px';
                numContainer.appendChild(num);
            }

            // 目盛りの配置
            for (let i = 0; i < 60; i++) {
                if (i % 5 === 0) continue;
                const tick = document.createElement('div');
                tick.className = 'tick';
                tick.style.transform = `rotate(${i * 6}deg)`;
                tickContainer.appendChild(tick);
            }
        }

        window.onload = () => {
            createFace();
            updateClock();
        };
    </script>
</body>
</html>
