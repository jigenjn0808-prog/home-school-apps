<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時計算マスター：中学受験モード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .clock-wrapper { position: relative; padding: 40px; display: flex; justify-content: center; }
        .clock {
            width: 280px; height: 280px;
            border: 12px solid #334155; border-radius: 50%;
            position: relative; background: #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: center bottom; border-radius: 10px; z-index: 10; }
        .hour-hand { width: 10px; height: 70px; background: #1e293b; margin-left: -5px; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .minute-hand { width: 6px; height: 110px; background: #e11d48; margin-left: -3px; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .center-dot { width: 16px; height: 16px; background: #1e293b; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; border: 2px solid #fff; }
        
        .number { position: absolute; width: 40px; height: 40px; text-align: center; line-height: 40px; font-weight: 900; font-size: 1.5rem; color: #334155; z-index: 5; }
        .tick { position: absolute; top: 0; left: 50%; width: 2px; height: 8px; background: #cbd5e1; margin-left: -1px; transform-origin: center 128px; }
        .tick-major { width: 4px; height: 14px; background: #475569; margin-left: -2px; }

        /* 分数表示用のスタイル */
        .fraction { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; vertical-align: middle; line-height: 1; margin: 0 4px; }
        .fraction-num { font-size: 0.6em; font-weight: bold; border-bottom: 2px solid currentColor; padding: 0 2px; }
        .fraction-den { font-size: 0.6em; font-weight: bold; padding: 0 2px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 py-8">

    <div class="bg-white p-6 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-slate-100">
        
        <div class="mb-4 space-y-2">
            <select id="quiz-category" class="w-full bg-slate-100 border border-slate-300 text-slate-700 font-bold py-2 px-4 rounded-xl outline-none focus:ring-2 focus:ring-blue-400">
                <option value="basic">① ぴったり重なる・一直線・直角</option>
                <option value="random_angle">② いろいろな角度</option>
                <option value="symmetry">③ 左右対称になる時間（難問！）</option>
            </select>
            
            <div id="quiz-container" class="p-4 bg-blue-600 text-white rounded-2xl shadow-md">
                <div class="flex justify-between items-center mb-1">
                    <p class="text-xs font-bold opacity-80">じゅけんもんだい：</p>
                    <button onclick="generateQuiz()" class="text-xs bg-white text-blue-600 px-3 py-1 rounded-full font-bold shadow active:scale-95">次の問題</button>
                </div>
                <p id="quiz-text" class="text-lg font-bold leading-tight">上のボタンから問題を選んでね！</p>
            </div>
        </div>

        <div class="clock-wrapper">
            <div class="clock" id="clock-face">
                <div id="hour-hand" class="hand hour-hand"></div>
                <div id="minute-hand" class="hand minute-hand"></div>
                <div class="center-dot"></div>
            </div>
        </div>

        <div class="mt-2 mb-4 bg-slate-100 rounded-2xl py-4 px-2 text-center border-2 border-slate-200">
            <div id="digital-display" class="text-3xl font-black text-slate-800 flex items-center justify-center">
                </div>
            <div class="text-sm font-bold text-rose-600 mt-2" id="angle-display">長針と短針の角度: 0°</div>
        </div>

        <div class="mt-4 bg-indigo-50 p-4 rounded-2xl border border-indigo-100">
            <p class="text-xs font-bold text-indigo-800 mb-2">▼ 今の「時」で、指定した角度になる時間を探す</p>
            <div class="flex items-center gap-2 justify-center">
                <input type="number" id="input-angle" class="w-20 text-center border-2 border-indigo-200 rounded-xl p-2 font-bold text-lg outline-none focus:border-indigo-500" min="0" max="180" placeholder="角度">
                <span class="text-sm font-bold text-indigo-800">度</span>
                <button onclick="searchTimes()" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl active:scale-95 shadow">探す</button>
            </div>
            <div id="candidates-area" class="mt-3 flex flex-col gap-2 empty:hidden"></div>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-2 w-full text-sm font-bold">
            <button onclick="addMinutes(-1)" class="bg-slate-100 py-3 rounded-xl text-slate-600 shadow-sm active:scale-95">-1分 戻す</button>
            <button onclick="addMinutes(1)" class="bg-blue-100 py-3 rounded-xl text-blue-600 shadow-sm active:scale-95">+1分 進める</button>
        </div>
    </div>

    <script>
        let totalMinutes = 600; // 内部は「分」の浮動小数点で管理（10:00 = 600.0）
        let currentTargetH = null;

        // 小数を分数に変換する関数（時計算特化）
        function floatToFraction(decimal) {
            if (decimal === 0) return { num: 0, den: 1 };
            
            const eps = 0.0001; // 誤差許容範囲
            // 時計算でよく出る分母 (11, 13, そして普通の分数)
            const denominators = [11, 13, 2, 3, 4, 5, 6, 10]; 
            
            for (let den of denominators) {
                let num = Math.round(decimal * den);
                if (Math.abs(decimal - (num / den)) < eps) {
                    return { num, den };
                }
            }
            // どの分母にも当てはまらない手動操作などの場合は秒(60分母)として扱う
            return { num: Math.round(decimal * 60), den: 60 };
        }

        // 時間を表示用にフォーマットしてHTMLを返す
        function formatTimeHTML(h, m_float) {
            let m_int = Math.floor(m_float);
            let m_decimal = m_float - m_int;
            
            let html = `<span>${h}</span><span class="text-xl mx-1 mt-2">時</span>`;
            
            let { num, den } = floatToFraction(m_decimal);
            
            if (num === 0) {
                html += `<span>${m_int}</span><span class="text-xl mx-1 mt-2">分</span>`;
            } else {
                // 帯分数の表示
                if (m_int > 0) {
                    html += `<span>${m_int}</span><span class="text-lg mx-1 mt-2">と</span>`;
                }
                html += `
                    <div class="fraction">
                        <span class="fraction-num">${num}</span>
                        <span class="fraction-den">${den}</span>
                    </div>
                    <span class="text-xl mx-1 mt-2">分</span>
                `;
            }
            return html;
        }

        function updateClock() {
            if (totalMinutes < 0) totalMinutes += 720;
            totalMinutes %= 720; // 12時間 = 720分

            let h = Math.floor(totalMinutes / 60);
            let displayH = h === 0 ? 12 : h;
            let m = totalMinutes % 60;

            // デジタル表示の更新
            document.getElementById('digital-display').innerHTML = formatTimeHTML(displayH, m);

            // 角度計算
            const hDeg = (totalMinutes / 720) * 360;
            const mDeg = (m / 60) * 360;

            document.getElementById('hour-hand').style.transform = `rotate(${hDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `rotate(${mDeg}deg)`;

            let diff = Math.abs(hDeg - mDeg);
            if (diff > 180) diff = 360 - diff;
            
            // 角度表示（小数の誤差を丸めて綺麗に出す）
            document.getElementById('angle-display').innerText = `長針と短針の角度: ${Math.round(diff * 100) / 100}°`;
        }

        function addMinutes(m) { 
            totalMinutes += m; 
            updateClock(); 
        }

        function setExactTime(h, m) {
            if (h === 12) h = 0;
            totalMinutes = (h * 60) + m;
            updateClock();
            document.getElementById('candidates-area').innerHTML = ''; // ジャンプしたら候補を消す
        }

        // 角度から時間を探すロジック
        function searchTimes() {
            const targetAngle = parseFloat(document.getElementById('input-angle').value);
            if (isNaN(targetAngle) || targetAngle < 0 || targetAngle > 180) {
                alert("0〜180の数字を入れてね！");
                return;
            }

            let currentH = Math.floor(totalMinutes / 60);
            let displayH = currentH === 0 ? 12 : currentH;

            // 公式: |30H - 5.5M| = Angle  =>  M = (30H ± Angle) / 5.5  =>  M = (60H ± 2*Angle) / 11
            const m1 = (60 * currentH - 2 * targetAngle) / 11;
            const m2 = (60 * currentH + 2 * targetAngle) / 11;

            let candidates = [];
            if (m1 >= 0 && m1 < 60) candidates.push(m1);
            if (m2 >= 0 && m2 < 60) candidates.push(m2);

            // 重複排除と並び替え
            candidates = [...new Set(candidates)].sort((a, b) => a - b);

            const area = document.getElementById('candidates-area');
            if (candidates.length === 0) {
                area.innerHTML = `<div class="text-sm text-rose-600 font-bold text-center bg-rose-50 p-2 rounded">${displayH}時台に${targetAngle}度になることはありません。</div>`;
                return;
            }

            let buttonsHtml = '';
            candidates.forEach((m_val, index) => {
                let timeStr = formatTimeHTML(displayH, m_val);
                // HTMLをプレーンテキストっぽく表示用に整形
                let cleanText = `${displayH}時 ${Math.floor(m_val)}`;
                let frac = floatToFraction(m_val - Math.floor(m_val));
                if(frac.num > 0) cleanText += `と ${frac.num}/${frac.den}`;
                cleanText += " 分";

                buttonsHtml += `
                    <button onclick="setExactTime(${currentH}, ${m_val})" 
                            class="bg-white border-2 border-indigo-200 text-indigo-700 font-bold py-2 px-4 rounded-xl hover:bg-indigo-50 active:bg-indigo-200 transition-colors flex justify-between items-center">
                        <span>${index + 1}回目：</span>
                        <span>${cleanText}</span>
                        <span class="text-xl">👉</span>
                    </button>
                `;
            });
            area.innerHTML = buttonsHtml;
        }

        // 問題生成
        function generateQuiz() {
            const category = document.getElementById('quiz-category').value;
            let targetH = Math.floor(Math.random() * 12) || 12; // 1〜12時
            let text = "";

            if (category === 'basic') {
                const types = [
                    { name: 'ぴったり重なる（0度）', angle: 0 },
                    { name: '一直線になる（180度）', angle: 180 },
                    { name: '直角になる（90度）', angle: 90 }
                ];
                let type = types[Math.floor(Math.random() * types.length)];
                text = `${targetH}時台で、長針と短針が「${type.name}」のは何時何分？<br><span class="text-sm font-normal">※下の『探す』機能を使ってみよう！</span>`;
            
            } else if (category === 'random_angle') {
                const angles = [30, 45, 60, 120, 150];
                let angle = angles[Math.floor(Math.random() * angles.length)];
                text = `${targetH}時台で、長針と短針が「${angle}度」になるのは何時何分？`;
            
            } else if (category === 'symmetry') {
                text = `${targetH}時台で、長針と短針が「文字盤の12と6を結ぶ線に対して左右対称」になるのは何時何分？<br><span class="text-sm font-normal text-amber-300">💡ヒント：答えの分母は13になるよ！</span>`;
            }

            document.getElementById('quiz-text').innerHTML = text;
            // 該当の「時」の0分に時計をリセットしておく（考えやすくするため）
            setExactTime(targetH, 0);
        }

        // 初期描画処理
        window.onload = () => { 
            const face = document.getElementById('clock-face');
            
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.className = i % 5 === 0 ? 'tick tick-major' : 'tick';
                tick.style.transform = `rotate(${i * 6}deg)`;
                face.appendChild(tick);
            }

            for (let i = 1; i <= 12; i++) {
                const num = document.createElement('div');
                num.className = 'number';
                num.innerText = i;
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const radius = 165; 
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                num.style.left = '50%';
                num.style.top = '50%';
                num.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                face.appendChild(num);
            }

            updateClock();
            generateQuiz(); // 最初から1問出しておく
        };
    </script>
</body>
</html>
