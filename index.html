<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>時計算マスター：中学受験モード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .clock {
            width: 300px; height: 300px;
            border: 12px solid #334155; border-radius: 50%;
            position: relative; background: #fff;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); margin: 0 auto;
        }
        .hand {
            position: absolute; bottom: 50%; left: 50%;
            transform-origin: center bottom; border-radius: 10px; z-index: 10;
        }
        .hour-hand { width: 10px; height: 70px; background: #1e293b; margin-left: -5px; transition: transform 0.5s cubic-bezier(0.4, 2, 0.5, 1); }
        .minute-hand { width: 5px; height: 120px; background: #e11d48; margin-left: -2.5px; transition: transform 0.5s cubic-bezier(0.4, 2, 0.5, 1); }
        .center-dot { width: 16px; height: 16px; background: #1e293b; border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; border: 2px solid #fff; }
        
        /* 数字を確実に出すためのスタイル */
        .number {
            position: absolute; width: 40px; height: 40px;
            text-align: center; line-height: 40px;
            font-weight: 900; font-size: 1.6rem; color: #334155; z-index: 5;
        }
        .tick { position: absolute; top: 0; left: 50%; width: 2px; height: 8px; background: #cbd5e1; margin-left: -1px; transform-origin: center 138px; }
        .tick-major { width: 4px; height: 14px; background: #475569; margin-left: -2px; }
        
        /* 数字の配置（CSSで固定） */
        .n1 { transform: translate(55px, 15px); } .n2 { transform: translate(100px, 60px); }
        .n3 { transform: translate(115px, 118px); } .n4 { transform: translate(100px, 175px); }
        .n5 { transform: translate(55px, 220px); } .n6 { transform: translate(-20px, 235px); }
        .n7 { transform: translate(-95px, 220px); } .n8 { transform: translate(-140px, 175px); }
        .n9 { transform: translate(-155px, 118px); } .n10 { transform: translate(-140px, 60px); }
        .n11 { transform: translate(-95px, 15px); } .n12 { transform: translate(-20px, 5px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center p-4 py-8">

    <div class="bg-white p-6 rounded-[2.5rem] shadow-2xl w-full max-w-sm border border-slate-100">
        <div id="quiz-container" class="mb-6 p-4 bg-blue-600 text-white rounded-2xl hidden shadow-lg animate-bounce-short">
            <p class="text-xs font-bold opacity-80">じゅけんもんだい：</p>
            <p id="quiz-text" class="text-lg font-bold leading-tight"></p>
        </div>

        <div class="clock" id="clock-face">
            <div class="number n1" style="left:50%">1</div><div class="number n2" style="left:50%">2</div>
            <div class="number n3" style="left:50%">3</div><div class="number n4" style="left:50%">4</div>
            <div class="number n5" style="left:50%">5</div><div class="number n6" style="left:50%">6</div>
            <div class="number n7" style="left:50%">7</div><div class="number n8" style="left:50%">8</div>
            <div class="number n9" style="left:50%">9</div><div class="number n10" style="left:50%">10</div>
            <div class="number n11" style="left:50%">11</div><div class="number n12" style="left:50%">12</div>
            
            <div id="hour-hand" class="hand hour-hand"></div>
            <div id="minute-hand" class="hand minute-hand"></div>
            <div class="center-dot"></div>
        </div>

        <div class="mt-6 flex flex-col items-center gap-2">
            <div class="text-4xl font-black text-slate-800 font-mono" id="digital-display">10:00</div>
            <div class="text-sm font-bold text-rose-600 bg-rose-50 px-4 py-1 rounded-full" id="angle-display">0°</div>
        </div>

        <div class="mt-6 grid grid-cols-2 gap-3 w-full">
            <button onclick="generateQuiz()" class="col-span-2 bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-md active:scale-95 transition-all">📝 もんだいをだす</button>
            <button onclick="showHint()" id="hint-btn" class="hidden bg-amber-400 text-white font-bold py-3 rounded-2xl active:scale-95">💡 かいせつ</button>
            <button onclick="checkAnswer()" id="check-btn" class="hidden bg-green-500 text-white font-bold py-3 rounded-2xl active:scale-95">✅ できた！</button>
        </div>

        <div id="explanation" class="mt-4 p-4 bg-amber-50 rounded-2xl hidden border border-amber-200 text-sm">
            <p id="explanation-text" class="text-amber-900 leading-relaxed font-medium"></p>
        </div>

        <div class="mt-6 grid grid-cols-4 gap-2 w-full text-[10px] font-bold">
            <button onclick="addMinutes(-5)" class="bg-slate-100 py-2 rounded-lg text-slate-500">-5分</button>
            <button onclick="addMinutes(5)" class="bg-blue-100 py-2 rounded-lg text-blue-600">+5分</button>
            <button onclick="addMinutes(-1)" class="bg-rose-50 py-2 rounded-lg text-rose-500">-1分</button>
            <button onclick="addMinutes(1)" class="bg-rose-500 py-2 rounded-lg text-white">+1分</button>
        </div>
    </div>

    <script>
        let totalMinutes = 600;
        let currentTargetAngle = null;

        function updateClock() {
            if (totalMinutes < 0) totalMinutes += 1440;
            totalMinutes %= 1440;
            const h12 = (Math.floor(totalMinutes / 60)) % 12;
            const mins = totalMinutes % 60;
            const hDeg = (h12 * 30) + (mins * 0.5);
            const mDeg = mins * 6;
            document.getElementById('hour-hand').style.transform = `rotate(${hDeg}deg)`;
            document.getElementById('minute-hand').style.transform = `rotate(${mDeg}deg)`;
            const displayH = h12 === 0 ? 12 : h12;
            document.getElementById('digital-display').innerText = `${displayH}:${mins.toString().padStart(2, '0')}`;
            let diff = Math.abs(hDeg - mDeg);
            if (diff > 180) diff = 360 - diff;
            document.getElementById('angle-display').innerText = `長針と短針の角度: ${diff % 1 === 0 ? diff.toFixed(0) : diff.toFixed(1)}°`;
            return diff;
        }

        function addMinutes(m) { totalMinutes += m; updateClock(); }

        // 問題生成
        function generateQuiz() {
            const angles = [0, 90, 180, 45, 60];
            currentTargetAngle = angles[Math.floor(Math.random() * angles.length)];
            const quizText = `長針と短針の角度を「${currentTargetAngle}度」にしてください。`;
            document.getElementById('quiz-text').innerText = quizText;
            document.getElementById('quiz-container').classList.remove('hidden');
            document.getElementById('hint-btn').classList.remove('hidden');
            document.getElementById('check-btn').classList.remove('hidden');
            document.getElementById('explanation').classList.add('hidden');
        }

        function checkAnswer() {
            const currentAngle = updateClock();
            if (Math.abs(currentAngle - currentTargetAngle) < 0.1) {
                alert("✨ 正解です！すごい！ ✨");
            } else {
                alert("おしい！角度をよく見てみてね。");
            }
        }

        function showHint() {
            const exp = document.getElementById('explanation');
            const text = document.getElementById('explanation-text');
            exp.classList.remove('hidden');
            text.innerHTML = `
                <strong>【時計算のポイント】</strong><br>
                1分間に長針は 6°、短針は 0.5° 進みます。<br>
                例えば 90° にしたい時は、3時ちょうどの位置などがわかりやすいよ！<br>
                今の時間は長針が ${ (totalMinutes % 60) * 6 }° の場所にあります。
            `;
        }

        // 目盛り生成
        function createTicks() {
            const face = document.getElementById('clock-face');
            for (let i = 0; i < 60; i++) {
                const tick = document.createElement('div');
                tick.className = i % 5 === 0 ? 'tick tick-major' : 'tick';
                tick.style.transform = `rotate(${i * 6}deg)`;
                face.appendChild(tick);
            }
        }

        window.onload = () => { createTicks(); updateClock(); };
    </script>
</body>
</html>
